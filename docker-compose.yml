services:

  node_a:
    build: ./node
    environment:
      NODE_ID: node_a
      PEERS: "http://node_b:8000,http://node_c:8000,http://node_d:8000"
      RATE_LIMIT: "100"
      TEST_API_URL: "https://httpbin.org"
    ports:
      - "8001:8000"
    networks:
      - rlnet
    restart: unless-stopped

  node_b:
    build: ./node
    environment:
      NODE_ID: node_b
      PEERS: "http://node_a:8000,http://node_c:8000,http://node_d:8000"
      RATE_LIMIT: "100"
      TEST_API_URL: "https://httpbin.org"
    ports:
      - "8002:8000"
    networks:
      - rlnet
    restart: unless-stopped

  node_c:
    build: ./node
    environment:
      NODE_ID: node_c
      PEERS: "http://node_a:8000,http://node_b:8000,http://node_d:8000"
      RATE_LIMIT: "100"
      TEST_API_URL: "https://httpbin.org"
    ports:
      - "8003:8000"
    networks:
      - rlnet
    restart: unless-stopped

  node_d:
    build: ./node
    environment:
      NODE_ID: node_d
      PEERS: "http://node_a:8000,http://node_b:8000,http://node_c:8000"
      RATE_LIMIT: "100"
      TEST_API_URL: "https://httpbin.org"
    ports:
      - "8004:8000"
    networks:
      - rlnet
    restart: unless-stopped

  generator:
    build: ./generator
    environment:
      NODES: "http://node_a:8000,http://node_b:8000,http://node_c:8000,http://node_d:8000"
      REQUESTS_PER_MINUTE: "300"
    depends_on:
      - node_a
      - node_b
      - node_c
      - node_d
    networks:
      - rlnet
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    environment:
      NODES: "http://node_a:8000,http://node_b:8000,http://node_c:8000,http://node_d:8000"
    ports:
      - "3000:3000"
    depends_on:
      - node_a
      - node_b
      - node_c
      - node_d
    networks:
      - rlnet
    restart: unless-stopped

networks:
  rlnet:
    driver: bridge